name: StakeUp checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stakeup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify PostgreSQL migrations and authorization
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -U postgres -d stakeup_test -v ON_ERROR_STOP=1
          -f supabase/tests/bootstrap-local.sql
          -f supabase/migrations/202611090001_foundation.sql
          -f supabase/migrations/20261109173728_social_challenges.sql
          -f supabase/migrations/20261110000100_evidence.sql
          -f supabase/migrations/20261110000200_upload_windows.sql
          -f supabase/migrations/20261110000300_competition.sql
          -f supabase/migrations/20261110000400_community.sql
          -f supabase/migrations/20261111000100_member_profiles.sql
          -f supabase/migrations/20261111000200_grace_bypass.sql
          -f supabase/migrations/20261111000300_review_inbox.sql
          -f supabase/migrations/20261113180125_experience_wallet.sql
          -f supabase/migrations/20261113191448_multicolor_themes.sql
          -f supabase/tests/foundation.sql
          -f supabase/tests/social_challenges.sql
          -f supabase/tests/evidence.sql
          -f supabase/tests/upload_windows.sql
          -f supabase/tests/competition.sql
          -f supabase/tests/community.sql
          -f supabase/tests/member_profiles.sql
          -f supabase/tests/review_inbox.sql
          -f supabase/tests/experience_wallet.sql
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
