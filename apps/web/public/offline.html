<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111317" />
    <title>StakeUp — Reconnect</title>
    <link rel="stylesheet" href="/offline.css" />
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="72" height="72" alt="StakeUp" />
      <p class="brand">STAKEUP</p>
      <h1 id="title">Let's reconnect.</h1>
      <p id="description">
        Connect to the internet to open your account, submit photos or review your teammates.
      </p>
      <p id="deadline">
        Uploads and votes are not queued offline. Server receipt time still determines submission
        deadlines.
      </p>
      <button id="retry" type="button">Try again</button>
      <p id="status" role="status"></p>
    </main>
  </body>
</html>
